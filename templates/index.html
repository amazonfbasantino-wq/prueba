<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Descargas</title>
  <style>
    :root {
      --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
      --border: #e4e2dc; --accent: #c2622d; --ok: #2f7d4f; --err: #b3372f; --warn: #a8741a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18; --card: #242422; --text: #ecebe6; --muted: #9c9a93;
        --border: #34332f; --accent: #e08555; --ok: #5cb883; --err: #e0675e; --warn: #d9a441;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 26px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; word-break: break-all; }
    .live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .empty { text-align: center; color: var(--muted); padding: 64px 16px; border: 1px dashed var(--border); border-radius: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
    .card.nuevo { animation: flash 1.5s ease-out; }
    @keyframes flash { from { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); } }
    .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .name { font-weight: 600; word-break: break-all; }
    .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .badge { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; border: 1px solid currentColor; }
    .badge.listo { color: var(--ok); } .badge.error { color: var(--err); } .badge.analizando { color: var(--warn); }
    .summary { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .summary p { margin: 6px 0; } .summary ul, .summary ol { margin: 6px 0; padding-left: 22px; }
    .summary.error { color: var(--err); }
    .loading { color: var(--muted); font-style: italic; }
    .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .actions a, .actions button {
      font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: transparent; color: var(--text); text-decoration: none;
    }
    .actions a:hover, .actions button:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Mis Descargas</h1>
      <div class="sub">Vigilando: {{ carpeta }}</div>
    </div>
    <span class="live"><span class="dot"></span>En vivo</span>
  </header>
  <div id="lista"></div>
</main>

<script>
  const lista = document.getElementById("lista");
  const vistos = new Set();
  let primeraCarga = true;
  let ultimo = "";

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Markdown mínimo: negritas, listas y párrafos.
  function md(texto) {
    const lineas = esc(texto).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").split("\n");
    let html = "", lista = null;
    for (const l of lineas) {
      const ul = l.match(/^\s*[-*•]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
      const tipo = ul ? "ul" : ol ? "ol" : null;
      if (lista && tipo !== lista) { html += `</${lista}>`; lista = null; }
      if (tipo) {
        if (!lista) { html += `<${tipo}>`; lista = tipo; }
        html += `<li>${(ul || ol)[1]}</li>`;
      } else if (l.trim()) {
        html += `<p>${l.replace(/^#+\s*/, "")}</p>`;
      }
    }
    return lista ? html + `</${lista}>` : html;
  }

  const tamano = (b) => b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} KB` : `${(b / 1048576).toFixed(1)} MB`;
  const etiqueta = { listo: "Listo", error: "Error", analizando: "Analizando…" };

  function tarjeta(a) {
    const nuevo = !primeraCarga && !vistos.has(a.id);
    vistos.add(a.id);
    const cuerpo = a.estado === "analizando"
      ? `<div class="summary loading">Claude está leyendo el archivo…</div>`
      : `<div class="summary ${a.estado === "error" ? "error" : ""}">${md(a.resumen)}</div>`;
    return `
      <div class="card${nuevo ? " nuevo" : ""}">
        <div class="top">
          <div>
            <div class="name">${esc(a.nombre)}</div>
            <div class="meta">${a.tipo.toUpperCase()} · ${tamano(a.tamano)} · ${a.fecha}</div>
          </div>
          <span class="badge ${a.estado}">${etiqueta[a.estado]}</span>
        </div>
        ${cuerpo}
        <div class="actions">
          <a href="/api/archivos/${a.id}/ver" target="_blank">Abrir archivo</a>
          ${a.estado !== "analizando" ? `<button onclick="reanalizar('${a.id}')">Volver a analizar</button>` : ""}
          <button onclick="quitar('${a.id}')">Quitar</button>
        </div>
      </div>`;
  }

  async function actualizar() {
    try {
      const datos = await (await fetch("/api/archivos")).json();
      const firma = JSON.stringify(datos);
      if (firma === ultimo) return;
      ultimo = firma;
      if (!primeraCarga && datos.some((a) => !vistos.has(a.id)) && window.Notification?.permission === "granted") {
        new Notification("Nueva descarga", { body: datos[0].nombre });
      }
      lista.innerHTML = datos.length
        ? datos.map(tarjeta).join("")
        : `<div class="empty">Todavía no hay descargas.<br>Descargá algo y va a aparecer acá automáticamente.</div>`;
      primeraCarga = false;
    } catch (e) { /* servidor reiniciándose; reintenta en el próximo ciclo */ }
  }

  async function reanalizar(id) { await fetch(`/api/archivos/${id}/reanalizar`, { method: "POST" }); actualizar(); }
  async function quitar(id) { await fetch(`/api/archivos/${id}`, { method: "DELETE" }); actualizar(); }

  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  actualizar();
  setInterval(actualizar, 2000);
</script>
</body>
</html>
